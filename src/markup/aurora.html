<div class="orb orb--aurora">
  <span class="orb__aura" aria-hidden="true"></span>
  <div class="orb__body">
    <div class="orb__glass">
      <span class="orb__veil" style="--dh:-70;--mul:1.4;--dir:reverse;--from:0deg"></span>
      <span class="orb__veil" style="--dh:30;--mul:2.2;--from:120deg"></span>
      <span class="orb__veil" style="--dh:140;--mul:3.6;--dir:reverse;--from:240deg"></span>
      <span class="orb__limb"></span>
      <span class="orb__sheen"></span>
      <span class="orb__spec"></span>
      <span class="orb__rim"></span>
      <span class="orb__grain"></span>
    </div>
  </div>
  <span class="orb__shadow" aria-hidden="true"></span>
</div>
