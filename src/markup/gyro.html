<div class="orb orb--gyro">
  <span class="orb__aura" aria-hidden="true"></span>
  <div class="orb__body">
    <div class="orb__rig orb__rig--back">
      <span class="orb__ring" style="--rx:74deg;--mul:1.1"></span>
      <span class="orb__ring" style="--rx:-22deg;--mul:1.7;--dir:reverse"></span>
      <span class="orb__ring" style="--rx:38deg;--mul:2.3"></span>
    </div>
    <div class="orb__core-orb">
      <span class="orb__sheen"></span>
      <span class="orb__spec"></span>
      <span class="orb__rim"></span>
    </div>
    <div class="orb__rig orb__rig--front">
      <span class="orb__ring" style="--rx:74deg;--mul:1.1"></span>
      <span class="orb__ring" style="--rx:-22deg;--mul:1.7;--dir:reverse"></span>
      <span class="orb__ring" style="--rx:38deg;--mul:2.3"></span>
    </div>
  </div>
  <span class="orb__shadow" aria-hidden="true"></span>
</div>
