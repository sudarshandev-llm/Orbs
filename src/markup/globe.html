<div class="orb orb--globe">
  <span class="orb__aura" aria-hidden="true"></span>
  <div class="orb__body">
    <span class="orb__glow-core"></span>
    <div class="orb__rig">
      <span class="orb__mer" style="--r:0deg"></span>
      <span class="orb__mer" style="--r:22.5deg"></span>
      <span class="orb__mer" style="--r:45deg"></span>
      <span class="orb__mer" style="--r:67.5deg"></span>
      <span class="orb__mer" style="--r:90deg"></span>
      <span class="orb__mer" style="--r:112.5deg"></span>
      <span class="orb__mer" style="--r:135deg"></span>
      <span class="orb__mer" style="--r:157.5deg"></span>
      <span class="orb__lat" style="--z:calc(var(--s) * .32);--sc:.77"></span>
      <span class="orb__lat" style="--z:calc(var(--s) * .16);--sc:.947"></span>
      <span class="orb__lat" style="--z:0px;--sc:1"></span>
      <span class="orb__lat" style="--z:calc(var(--s) * -.16);--sc:.947"></span>
      <span class="orb__lat" style="--z:calc(var(--s) * -.32);--sc:.77"></span>
    </div>
    <span class="orb__haze"></span>
    <span class="orb__rim"></span>
    <span class="orb__grain"></span>
  </div>
  <span class="orb__shadow" aria-hidden="true"></span>
</div>
