<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Orbs preview</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(75% 130% at 50% -10%, #16122f 0%, #0a0817 52%, #05040c 100%);
    font: 500 11px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6f6a92;
  }
  .row { display: flex; align-items: center; gap: 54px; padding: 20px 40px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 18px; position: relative; }
  figure::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150px;
    height: 150px;
    transform: translate(-50%, -62%);
    border-radius: 50%;
    background: radial-gradient(circle, hsl(var(--h) 95% 60% / .18), transparent 68%);
    filter: blur(10px);
  }
  figcaption { font-size: 10.5px; color: #7d7799; }
  assistant-orb { position: relative; }
</style>
</head>
<body>
  <div class="row">
    <figure style="--h:265"><assistant-orb variant="sphere" size="118" hue="265" decorative></assistant-orb><figcaption>Glass sphere</figcaption></figure>
    <figure style="--h:196"><assistant-orb variant="gyro" size="118" hue="196" decorative></assistant-orb><figcaption>Neon gyro</figcaption></figure>
    <figure style="--h:168"><assistant-orb variant="globe" size="118" hue="168" decorative></assistant-orb><figcaption>Wire globe</figcaption></figure>
    <figure style="--h:302"><assistant-orb variant="grain" size="118" hue="302" decorative></assistant-orb><figcaption>Grain</figcaption></figure>
    <figure style="--h:222"><assistant-orb variant="grain-glow" size="118" hue="222" decorative></assistant-orb><figcaption>Grain glow</figcaption></figure>
  </div>
  <script src="../orb.js"></script>
</body>
</html>
